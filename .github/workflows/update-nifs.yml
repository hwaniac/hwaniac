name: Update NIFS water temperature

on:
  workflow_dispatch:

  schedule:
    - cron: "5,35 * * * *"

permissions:
  contents: write

jobs:
  update-nifs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NIFS data
        env:
          NIFS_API_KEY: ${{ secrets.NIFS_API_KEY }}
        run: |
          python scripts/fetch_nifs.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/risa-latest.json data/risa-stations.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NIFS water temperature data"
            git push
          fi
